[project]
name = "boveda-pyme"
version = "0.1.0"
description = "Daemon Linux de Respaldo Cifrado, Deduplicado y Sincronización Cloud para PyMEs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "cryptography>=43.0",
    "zstandard>=0.23",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "boto3>=1.35",
    "httpx>=0.27",
    "structlog>=24.0",
    "tenacity>=9.0",
    "argon2-cffi>=23.0",
    "python-dateutil>=2.9.0.post0",
    "aioboto3>=15.5.0",
    "aiohttp>=3.14.3",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
]

[project.scripts]
boveda = "boveda.cli:main"

[build-system]
requires = ["uv_build>=0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "boveda"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "flake8>=7.0",
    "ruff>=0.4",
    "bandit>=1.7",
    "mypy>=1.11",
    "pyinstaller>=6.22.2",
    "types-python-dateutil>=2.9.0.20260807",
]

[tool.pytest.ini_options]
pythonpath = ['src']


[tool.mypy]
ignore_missing_imports = true
# Justificacion: aioboto3 y botocore no proveen stubs oficiales integrados y estamos usando el driver directamente.
